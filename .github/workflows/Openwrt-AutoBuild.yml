name: Build ImmortalWrt Firmware

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Setup Build Environment (if needed, depending on your requirements)
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache libncurses5-dev zlib1g-dev gawk git wget

      # Step 3: Copy custom configuration files (onecloud.config)
      - name: Copy onecloud.config
        run: |
          cp ./Kwrt/onecloud.config ./openwrt/.config

      # Step 4: Run diy-part.sh script (custom modifications)
      - name: Run diy-part.sh
        run: |
          bash $GITHUB_WORKSPACE/diy-part.sh

      # Step 5: Initialize and update feeds
      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Step 6: Build the firmware (replace with your actual build command)
      - name: Build ImmortalWrt firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s

      # Optional: Upload firmware as artifact (adjust as needed)
      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v2
        with:
          name: immortalwrt-firmware
          path: ./openwrt/bin/targets/*/image/*.bin
